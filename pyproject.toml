[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hedging"
version = "0.2.0"
authors = [{name = "b23cs1066"}, {name = "b23ee1068"}]
description = "RL (PPO) derivative hedging vs. Black-Scholes delta-hedge baselines across volatility regimes"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "gymnasium>=0.29",
    "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".runtime"]
